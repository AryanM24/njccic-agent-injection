<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <!-- A document with a hidden note; its line runs through three agents and ends at an email going out. -->
  <!-- path the note travels -->
  <path d="M190 250 C 260 250, 280 150, 340 140" fill="none" stroke="#F2C14E" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
  <path d="M372 172 C 410 205, 420 245, 400 278" fill="none" stroke="#B9C4BF" stroke-width="4" stroke-linecap="round"/>
  <path d="M372 322 C 352 360, 350 390, 352 410" fill="none" stroke="#B9C4BF" stroke-width="4" stroke-linecap="round"/>
  <path d="M318 456 C 280 485, 240 492, 214 492" fill="none" stroke="#EB6834" stroke-width="4" stroke-linecap="round"/>

  <!-- document -->
  <rect x="30" y="70" width="190" height="250" rx="16" fill="#2E3E3A"/>
  <path d="M60 104 h52" stroke="#F2F5F3" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#4D605A" stroke-width="9" stroke-linecap="round">
    <path d="M60 146 h128"/><path d="M60 172 h128"/><path d="M60 198 h86"/><path d="M60 286 h128"/>
  </g>
  <rect x="52" y="234" width="146" height="30" rx="8" fill="#F2C14E"/>
  <path d="M66 249 h90" stroke="#1E2A27" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/>

  <!-- three agents -->
  <g fill="#1E2A27" stroke="#F2F5F3" stroke-width="4">
    <circle cx="356" cy="150" r="36"/>
    <circle cx="390" cy="300" r="36"/>
    <circle cx="340" cy="440" r="36"/>
  </g>
  <!-- intake: inbox tray -->
  <path d="M338 146 l6 -12 h24 l6 12 v12 h-36 z M338 146 h10 l3 5 h10 l3 -5 h10" fill="none" stroke="#F2F5F3" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- analysis: magnifier -->
  <circle cx="385" cy="295" r="11" fill="none" stroke="#F2F5F3" stroke-width="3.5"/>
  <path d="M393 303 l10 10" stroke="#F2F5F3" stroke-width="4" stroke-linecap="round"/>
  <!-- action: lightning bolt -->
  <path d="M344 422 l-12 21 h10 l-4 17 l14 -23 h-10 z" fill="#F2F5F3"/>

  <!-- email going out -->
  <circle cx="180" cy="492" r="40" fill="#EB6834"/>
  <rect x="160" y="478" width="40" height="28" rx="4" fill="#1E2A27"/>
  <path d="M161 480 l19 14 l19 -14" fill="none" stroke="#EB6834" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
